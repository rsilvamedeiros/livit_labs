<div class="app-shell" [class]="'theme-' + product()">
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
  <header class="topbar">
    <a class="brand" routerLink="/" [attr.aria-label]="'Livit ' + productName() + ' - início'">
      <img class="brand-lockup" [src]="brandAsset()" [alt]="productName() ? 'Livit ' + productName() : 'Livit'">
    </a>
    <nav aria-label="Produtos Livit">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Início</a>
      <a routerLink="/labs" routerLinkActive="active">Labs</a>
      <a routerLink="/invest" routerLinkActive="active">Invest</a>
      <a routerLink="/flow" routerLinkActive="active">Flow</a>
    </nav>
    <a class="ecosystem-link" [routerLink]="product() === 'institutional' ? '/flow' : '/'">{{ product() === 'institutional' ? 'Começar agora' : 'Ecossistema Livit' }} <span aria-hidden="true">↗</span></a>
  </header>
  <main id="main-content" tabindex="-1"><router-outlet /></main>
  <footer>
    <div class="footer-brand">Livit @if (productName()) { <b>{{ productName() }}</b> }</div>
    <span>{{ tagline() }}</span>
    <small>© 2026 Livit. Projeto demonstrativo.</small>
  </footer>
</div>
