<div class="app-shell" [class]="'theme-' + product()">
  <header class="topbar">
    <a class="brand" routerLink="/" [attr.aria-label]="'Livit ' + productName() + ' - início'">
      @if (product() === 'labs') { <img src="assets/img/logo_branco.png" alt="Livit Labs"> }
      @else { <span class="brand-symbol">L</span><span>Livit <b>{{ productName() }}</b></span> }
    </a>
    <nav aria-label="Produtos Livit">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Labs</a>
      <a routerLink="/invest" routerLinkActive="active">Invest</a>
      <a routerLink="/flow" routerLinkActive="active">Flow</a>
    </nav>
    <a class="ecosystem-link" routerLink="/">Ecossistema Livit <span aria-hidden="true">↗</span></a>
  </header>
  <main><router-outlet /></main>
  <footer>
    <div class="footer-brand">Livit <b>{{ productName() }}</b></div>
    <span>{{ tagline() }}</span>
    <small>© 2026 Livit. Projeto demonstrativo.</small>
  </footer>
</div>
